<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<title>Reichsgasse 35 Erkennung</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #camera {
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; transform:none; background:#000;
    -webkit-user-select:none; user-select:none; pointer-events:none;
  }

  /* iOS/Safari: möglichen zentralen Start-Play-Button verstecken */
  video::-webkit-media-controls { display:none !important; }
  video::-webkit-media-controls-panel { display:none !important; }
  video::-webkit-media-controls-play-button { display:none !important; }
  video::-webkit-media-controls-start-playback-button { display:none !important; -webkit-appearance:none; }

  #videoCover {
    position:fixed; inset:0; background:#000; z-index:5;
    pointer-events:none;
  }
  #videoCover.hidden { display:none; }

  #shot {
    position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translateX(-50%); width:76px; height:76px; border-radius:999px;
    border:5px solid rgba(255,255,255,.95); background:rgba(255,255,255,.18);
    box-shadow:0 0 0 5px rgba(0,0,0,.22); z-index:10;
  }
  #shot:active { transform:translateX(-50%) scale(.92); }
  #shot.loading { opacity:.45; }

  #result {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    text-align:center; padding:28px; color:#fff;
    font-size:clamp(30px,7vw,56px); font-weight:800; line-height:1.1;
    background:rgba(0,0,0,.58); z-index:20;
  }
  #result.show { display:flex; }
  #result.success { background:rgba(0,95,36,.64); }
  #result.fail { background:rgba(120,0,0,.64); }
  canvas { display:none; }
</style>
</head>
<body>
<video id="camera" autoplay playsinline webkit-playsinline muted disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback nofullscreen"></video>
<div id="videoCover"></div>
<button id="shot" class="loading" aria-label="Foto aufnehmen"></button>
<div id="result"></div>
<canvas id="capture"></canvas>
<script async src="https://docs.opencv.org/4.9.0/opencv.js" onload="cvReadyHook()"></script>
<script>
const REFERENCE_IMAGES = [
  'images/ref_01.jpg','images/ref_02.jpg','images/ref_03.jpg','images/ref_04.jpg','images/ref_05.jpg',
  'images/ref_06.jpg','images/ref_07.jpg','images/ref_08.jpg','images/ref_09.jpg','images/ref_10.jpg',
  'images/ref_11.jpg','images/ref_12.jpg','images/ref_13.jpg','images/ref_14.jpg','images/ref_15.jpg',
  'images/ref_16.jpg','images/ref_17.jpg'
];

// Reichsgasse 35, Chur. Toleranzen bewusst etwas grosszügig, weil Handy-GPS/Kompass in der Stadt schwanken.
const BUILDING = {
  lat: 46.850100,
  lng: 9.533720,
  maxDistanceM: 120,
  veryNearM: 28,
  bearingToleranceDeg: 85
};

let stream = null;
let userPosition = null;
let currentHeading = null;

let cvIsReady = false;
let refsReady = false;
let detector = null;
let matcher = null;
let references = [];

const video = document.getElementById('camera');
const shot = document.getElementById('shot');
const result = document.getElementById('result');
const canvas = document.getElementById('capture');
const videoCover = document.getElementById('videoCover');

function cvReadyHook(){
  if (typeof cv !== 'undefined') {
    cv['onRuntimeInitialized'] = async () => {
      cvIsReady = true;
      await prepareMatcher();
      refsReady = true;
      shot.classList.remove('loading');
    };
  }
}

async function startCamera(){
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    video.srcObject = stream;
    video.muted = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');

    const reveal = () => videoCover.classList.add('hidden');
    video.addEventListener('playing', reveal, { once:true });
    video.addEventListener('loadedmetadata', async () => {
      try { await video.play(); } catch(e) {}
      if (video.readyState >= 2) setTimeout(reveal, 250);
    }, { once:true });

    try { await video.play(); } catch(e) {}
  } catch(e) {
    showResult(false);
  }
}

function askLocation(){
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    pos => {
      userPosition = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy || 999
      };
    },
    () => {},
    { enableHighAccuracy:true, maximumAge:1000, timeout:10000 }
  );
}

async function askOrientationPermissionIfNeeded(){
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      const response = await DeviceOrientationEvent.requestPermission();
      return response === 'granted';
    }
    return true;
  } catch(e) {
    return false;
  }
}

function startOrientation(){
  window.addEventListener('deviceorientation', ev => {
    // iOS Safari liefert webkitCompassHeading; andere Browser alpha.
    if (typeof ev.webkitCompassHeading === 'number') {
      currentHeading = ev.webkitCompassHeading;
    } else if (typeof ev.alpha === 'number') {
      currentHeading = (360 - ev.alpha) % 360;
    }
  }, true);
}

function distanceMeters(aLat,aLng,bLat,bLng){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(bLat-aLat), dLng=toRad(bLng-aLng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(aLat))*Math.cos(toRad(bLat))*Math.sin(dLng/2)**2;
  return 2*R*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}

function bearingToTarget(aLat,aLng,bLat,bLng){
  const toRad=x=>x*Math.PI/180, toDeg=x=>x*180/Math.PI;
  const φ1=toRad(aLat), φ2=toRad(bLat), Δλ=toRad(bLng-aLng);
  const y=Math.sin(Δλ)*Math.cos(φ2);
  const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return (toDeg(Math.atan2(y,x))+360)%360;
}

function angleDiff(a,b){
  return Math.abs(((a-b+540)%360)-180);
}

function spatialCheck(){
  // Wenn Standort noch nicht verfügbar ist, nicht blockieren: Bildvergleich darf entscheiden.
  if (!userPosition) return { ok:true, distance:null, headingOK:true };

  const d = distanceMeters(userPosition.lat, userPosition.lng, BUILDING.lat, BUILDING.lng);
  const tolerance = Math.max(BUILDING.maxDistanceM, 50 + (userPosition.accuracy || 0));
  const distanceOK = d <= tolerance;

  // Sehr nahe am Gebäude reicht GPS-Nähe; dort ist Kompass oft unzuverlässig.
  if (d <= BUILDING.veryNearM + (userPosition.accuracy || 0) * 0.5) {
    return { ok:distanceOK, distance:d, headingOK:true };
  }

  // Wenn Kompass noch nicht verfügbar ist, nur die Distanz prüfen.
  if (currentHeading === null) {
    return { ok:distanceOK, distance:d, headingOK:true };
  }

  const targetBearing = bearingToTarget(userPosition.lat, userPosition.lng, BUILDING.lat, BUILDING.lng);
  const diff = angleDiff(currentHeading, targetBearing);
  const headingOK = diff <= BUILDING.bearingToleranceDeg;

  return { ok: distanceOK && headingOK, distance:d, headingOK };
}

async function imageToMat(url){
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = url + '?v=2';
  await img.decode();
  const c = document.createElement('canvas');
  const scale = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
  c.width = Math.round(img.naturalWidth * scale);
  c.height = Math.round(img.naturalHeight * scale);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return cv.imread(c);
}

function createDetector(){
  if (cv.ORB) return new cv.ORB(2000);
  if (cv.AKAZE) return new cv.AKAZE();
  return null;
}

async function prepareMatcher(){
  detector = createDetector();
  if (!detector || !cv.BFMatcher) return;
  matcher = new cv.BFMatcher(cv.NORM_HAMMING, false);

  for (const url of REFERENCE_IMAGES) {
    try {
      let src = await imageToMat(url);
      let gray = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      let kp = new cv.KeyPointVector();
      let desc = new cv.Mat();
      detector.detectAndCompute(gray, new cv.Mat(), kp, desc);
      if (!desc.empty() && kp.size() > 40) references.push({ url, kp, desc });
      src.delete(); gray.delete();
    } catch(e) {}
  }
}

function captureMat(){
  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;
  const scale = Math.min(1, 1100 / Math.max(vw, vh));
  canvas.width = Math.round(vw * scale);
  canvas.height = Math.round(vh * scale);
  const ctx = canvas.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return cv.imread(canvas);
}

function analyzeWithFeatures(){
  if (!cvIsReady || !refsReady || !detector || !matcher || references.length === 0) return false;
  let src=null, gray=null, kp=null, desc=null;
  try {
    src = captureMat();
    gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    kp = new cv.KeyPointVector();
    desc = new cv.Mat();
    detector.detectAndCompute(gray, new cv.Mat(), kp, desc);
    if (desc.empty() || kp.size() < 35) return false;

    let best = { good:0, ratio:0 };

    for (const ref of references) {
      let matches = new cv.DMatchVectorVector();
      matcher.knnMatch(desc, ref.desc, matches, 2);

      let good = 0;
      for (let i=0; i<matches.size(); i++) {
        const pair = matches.get(i);
        if (pair.size() >= 2) {
          const m = pair.get(0), n = pair.get(1);
          if (m.distance < 0.78 * n.distance && m.distance < 76) good++;
        }
      }
      matches.delete();

      const ratio = good / Math.max(1, Math.min(kp.size(), ref.kp.size()));
      if (good > best.good) best = { good, ratio };
    }

    // Etwas toleranter als vorher, weil zusätzlich GPS + Ausrichtung mitentscheiden.
    return best.good >= 22 || (best.good >= 15 && best.ratio > 0.025);
  } catch(e) {
    return false;
  } finally {
    if(src) src.delete(); if(gray) gray.delete(); if(kp) kp.delete(); if(desc) desc.delete();
  }
}

function showResult(ok){
  result.textContent = ok ? 'Erkennung erfolgreich' : 'Erkennung fehlgeschlagen';
  result.className = 'show ' + (ok ? 'success' : 'fail');
  setTimeout(() => { result.className = ''; result.textContent=''; }, 1800);
}

shot.addEventListener('click', async () => {
  if (!stream) await startCamera();

  // iPhone braucht diese Erlaubnis normalerweise erst nach User-Geste.
  await askOrientationPermissionIfNeeded();
  startOrientation();

  const space = spatialCheck();
  const imageOK = analyzeWithFeatures();

  // Kombination aus Raumlogik und Bild-Erkennung:
  // - Normalfall: GPS/Ausrichtung plausibel UND Bild passt.
  // - Fallback: Wenn GPS/Kompass noch nicht bereit ist, darf ein starker Bildtreffer reichen.
  const ok = (space.ok && imageOK);

  showResult(ok);
});

(async function init(){
  askLocation();
  startOrientation();
  await startCamera();
})();
</script>
</body>
</html>
