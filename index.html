<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Reichsgasse 35 – Kamera-Erkennung</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}
#stage{position:fixed;inset:0;background:#000;overflow:hidden}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;pointer-events:none}
video::-webkit-media-controls,
video::-webkit-media-controls-panel,
video::-webkit-media-controls-play-button,
video::-webkit-media-controls-start-playback-button{display:none!important;-webkit-appearance:none!important;opacity:0!important}
#shot{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);width:76px;height:76px;border-radius:999px;border:5px solid rgba(255,255,255,.95);background:rgba(255,255,255,.18);box-shadow:0 0 0 5px rgba(0,0,0,.22);z-index:10}
#shot:active{transform:translateX(-50%) scale(.92)}
#shot.loading{opacity:.45}
#result{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:28px;color:#fff;font-size:clamp(30px,7vw,56px);font-weight:800;line-height:1.1;background:rgba(0,0,0,.58);z-index:20}
#result.show{display:flex}
#result.success{background:rgba(0,95,36,.64)}
#result.fail{background:rgba(120,0,0,.64)}
#debug{position:fixed;left:8px;right:8px;top:8px;z-index:40;display:none;color:#fff;background:rgba(0,0,0,.68);font-size:12px;padding:8px;border-radius:10px;white-space:pre-wrap;max-height:46vh;overflow:auto}
#debug.show{display:block}
</style>
</head>
<body>
<div id="stage"></div>
<button id="shot" aria-label="Foto aufnehmen"></button>
<div id="result"></div>
<div id="debug"></div>
<script>
/*
  Reichsgasse 35 Prototyp:
  Schnelle Erkennung über GPS + Kamera-Blickrichtung.
  Kein OpenCV, keine Bild-KI, dadurch schnell und stabiler.
*/
const BUILDING = {
  name: "Reichsgasse 35",
  lat: 46.850100,
  lng: 9.533720,

  // Erkennung ab ca. 20m möglich, aber nicht "immer erfolgreich".
  maxDistanceM: 95,

  // Sichtkegel: kleiner = strenger. Handy-Kompass schwankt, deshalb nicht unter 20 setzen.
  bearingToleranceFarDeg: 28,
  bearingToleranceNearDeg: 48,

  // unter dieser Distanz etwas toleranter, weil Zielwinkel direkt vor dem Gebäude stark springt
  nearDistanceM: 25
};

let video=null, stream=null;
let userPosition=null;
let currentHeading=null;
let orientationStarted=false;
let firstTapDone=false;
let tapCounter=0;

const stage=document.getElementById("stage");
const shot=document.getElementById("shot");
const result=document.getElementById("result");
const debugBox=document.getElementById("debug");

function createVideo(){
  if(video) return video;
  video=document.createElement("video");
  video.autoplay=true;
  video.muted=true;
  video.playsInline=true;
  video.controls=false;
  video.setAttribute("autoplay","");
  video.setAttribute("muted","");
  video.setAttribute("playsinline","");
  video.setAttribute("webkit-playsinline","");
  video.setAttribute("disablepictureinpicture","");
  video.setAttribute("controlslist","nodownload noplaybackrate noremoteplayback nofullscreen");
  stage.appendChild(video);
  return video;
}

async function startCamera(){
  if(stream && video && video.readyState>=2) return true;
  try{
    const v=createVideo();
    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });
    v.srcObject=stream;
    await v.play();
    return true;
  }catch(e){
    updateDebug("Kamera-Fehler: "+e.message);
    return false;
  }
}

function askLocation(){
  if(!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    p=>{
      userPosition={
        lat:p.coords.latitude,
        lng:p.coords.longitude,
        accuracy:p.coords.accuracy || 999
      };
      updateDebug();
    },
    e=>updateDebug("GPS-Fehler: "+e.message),
    {enableHighAccuracy:true,maximumAge:500,timeout:12000}
  );
}

async function askOrientationPermission(){
  try{
    if(typeof DeviceOrientationEvent!=="undefined" &&
       typeof DeviceOrientationEvent.requestPermission==="function"){
      return (await DeviceOrientationEvent.requestPermission())==="granted";
    }
    return true;
  }catch(e){
    updateDebug("Kompass-Erlaubnis-Fehler: "+e.message);
    return false;
  }
}

function startOrientation(){
  if(orientationStarted) return;
  orientationStarted=true;
  window.addEventListener("deviceorientation",ev=>{
    // iPhone/Safari
    if(typeof ev.webkitCompassHeading==="number"){
      currentHeading=ev.webkitCompassHeading;
    }
    // Android/andere Browser
    else if(typeof ev.alpha==="number"){
      currentHeading=(360-ev.alpha)%360;
    }
    updateDebug();
  },true);
}

function distanceMeters(aLat,aLng,bLat,bLng){
  const R=6371000,toRad=x=>x*Math.PI/180;
  const dLat=toRad(bLat-aLat),dLng=toRad(bLng-aLng);
  const s=Math.sin(dLat/2)**2+Math.cos(toRad(aLat))*Math.cos(toRad(bLat))*Math.sin(dLng/2)**2;
  return 2*R*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}

function bearingToTarget(aLat,aLng,bLat,bLng){
  const toRad=x=>x*Math.PI/180,toDeg=x=>x*180/Math.PI;
  const p1=toRad(aLat),p2=toRad(bLat),dl=toRad(bLng-aLng);
  const y=Math.sin(dl)*Math.cos(p2);
  const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (toDeg(Math.atan2(y,x))+360)%360;
}

function angleDiff(a,b){
  return Math.abs(((a-b+540)%360)-180);
}

function recognitionCheck(){
  if(!stream) return {ok:false, reason:"Kamera nicht bereit"};
  if(!userPosition) return {ok:false, reason:"GPS fehlt"};
  if(currentHeading===null) return {ok:false, reason:"Kompass fehlt"};

  const d=distanceMeters(userPosition.lat,userPosition.lng,BUILDING.lat,BUILDING.lng);
  const accuracy=userPosition.accuracy || 999;

  // Distanz nicht zu grosszügig: max. 95m plus kleiner GPS-Puffer.
  const distanceLimit=BUILDING.maxDistanceM + Math.min(accuracy*0.35, 18);
  if(d>distanceLimit){
    return {ok:false, reason:"zu weit weg", distance:d};
  }

  const target=bearingToTarget(userPosition.lat,userPosition.lng,BUILDING.lat,BUILDING.lng);
  const diff=angleDiff(currentHeading,target);

  const allowed=d<=BUILDING.nearDistanceM
    ? BUILDING.bearingToleranceNearDeg
    : BUILDING.bearingToleranceFarDeg;

  if(diff>allowed){
    return {ok:false, reason:"falsche Richtung", distance:d, diff, allowed, target};
  }

  return {ok:true, reason:"GPS + Blickrichtung OK", distance:d, diff, allowed, target};
}

function showResult(ok){
  result.textContent=ok ? "Erkennung erfolgreich" : "Erkennung fehlgeschlagen";
  result.className="show "+(ok ? "success" : "fail");
  setTimeout(()=>{result.className="";result.textContent="";},1500);
}

function updateDebug(extra=""){
  if(!debugBox.classList.contains("show")) return;
  let dist="-",target="-",diff="-";
  if(userPosition){
    const d=distanceMeters(userPosition.lat,userPosition.lng,BUILDING.lat,BUILDING.lng);
    dist=Math.round(d)+"m";
    const b=bearingToTarget(userPosition.lat,userPosition.lng,BUILDING.lat,BUILDING.lng);
    target=Math.round(b)+"°";
    if(currentHeading!==null) diff=Math.round(angleDiff(currentHeading,b))+"°";
  }
  debugBox.textContent =
`Kamera: ${stream ? "OK" : "nein"} / Video: ${video ? ((video.videoWidth||0)+"x"+(video.videoHeight||0)) : "kein Video"}
GPS: ${userPosition ? (userPosition.lat.toFixed(6)+", "+userPosition.lng.toFixed(6)+" ±"+Math.round(userPosition.accuracy||0)+"m") : "fehlt"}
Distanz: ${dist}
Kompass: ${currentHeading===null ? "fehlt" : Math.round(currentHeading)+"°"}
Zielrichtung: ${target}
Differenz: ${diff}
${extra}`;
}

shot.addEventListener("click",async()=>{
  tapCounter++;
  setTimeout(()=>tapCounter=0,1400);
  if(tapCounter>=5){
    debugBox.classList.toggle("show");
    tapCounter=0;
    updateDebug("Diagnosemodus");
    return;
  }

  shot.classList.add("loading");

  if(!firstTapDone){
    firstTapDone=true;
    askLocation();
    await askOrientationPermission();
    startOrientation();
  }

  const camOK=await startCamera();
  if(!camOK){
    shot.classList.remove("loading");
    showResult(false);
    return;
  }

  // Kurz warten, damit GPS/Kompass nach der Erlaubnis Werte liefern können.
  await new Promise(r=>setTimeout(r,250));

  const check=recognitionCheck();
  updateDebug(check.reason);
  shot.classList.remove("loading");
  showResult(check.ok);
});

// GPS früh anfragen; iOS fragt trotzdem erst bei Bedarf.
askLocation();
</script>
</body>
</html>
